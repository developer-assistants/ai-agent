[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-hub"
version = "0.1.0"
description = "Open-source AI Agent Hub with 12 multi-step agents, tool traces, SQLite memory, CLI, and Docker runtime."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-agent = "ai_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ai_agent*"]
