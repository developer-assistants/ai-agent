services:
  ai-agent-hub:
    build: .
    ports:
      - "8080:8080"
    environment:
      - AI_AGENT_DB=/data/memory.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ai_agent_data:/data

volumes:
  ai_agent_data:
